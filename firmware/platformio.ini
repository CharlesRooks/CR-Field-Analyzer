[platformio]
default_envs = sentinelos_lilygo_amoled
boards_dir = boards

[env:sentinelos_lilygo_amoled]
platform = espressif32@6.12.0
board = T-Display-AMOLED
framework = arduino
lib_ldf_mode = deep+

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600

lib_extra_dirs =
    ../reference/LilyGo-AMOLED-Series

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4