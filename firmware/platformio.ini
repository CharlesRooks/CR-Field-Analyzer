[platformio]
default_envs = sentinelos_lilygo_amoled
boards_dir = boards

[env:sentinelos_lilygo_amoled]
platform = espressif32@6.12.0
board = T-Display-AMOLED
framework = arduino
lib_ldf_mode = deep+

; Milestone 10.19C promotes TinyUSB CDC + read-only SD Mass Storage to
; the normal SentinelOS USB architecture. The isolated 10.19A POC source
; remains excluded from the production application.
build_src_filter =
    +<*>
    -<UsbMscPocMain.cpp>

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600

lib_extra_dirs =
    ../reference/LilyGo-AMOLED-Series

; The LilyGO board definition supplies ARDUINO_USB_MODE=1. Remove that
; hardware CDC/JTAG selection before enabling TinyUSB OTG mode.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DSENTINELOS_USB_STORAGE_FEATURE=1

; Development note:
; TinyUSB CDC + MSC is retained for production USB Storage Mode.
; On this LilyGO/Windows combination, firmware upload from a running
; TinyUSB build requires manually entering the ESP32-S3 ROM downloader
; with BOOT/RST, then uploading to the enumerated ROM COM port.

lib_deps =
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
; -----------------------------------------------------------------------------
; Milestone 10.19A - USB Mass Storage read-only proof of concept
; -----------------------------------------------------------------------------
; This environment is intentionally NOT the default environment. It switches
; the ESP32-S3 native USB peripheral from Hardware CDC/JTAG mode to TinyUSB OTG
; mode and builds only the isolated USB MSC proof-of-concept source file.
;
; Build/upload explicitly with:
;   python -m platformio run -e sentinelos_usb_msc_poc
;   python -m platformio run -e sentinelos_usb_msc_poc --target upload
;
[env:sentinelos_usb_msc_poc]
extends = env:sentinelos_lilygo_amoled

build_src_filter =
    -<*>
    +<UsbMscPocMain.cpp>

; The board definition supplies ARDUINO_USB_MODE=1 for normal SentinelOS.
; Remove it for this TinyUSB OTG proof-of-concept before defining mode 0.
build_unflags =
    -DARDUINO_USB_MODE=1

; Keep LV_CONF_INCLUDE_SIMPLE from the production environment because the
; inherited LilyGO/LVGL dependency graph is still compiled for this POC.
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; -----------------------------------------------------------------------------
; Milestone 10.19B compatibility environment
; -----------------------------------------------------------------------------
; USB Storage Mode is now part of the normal production environment. Keep this
; environment name temporarily so existing build commands continue to work.
;
[env:sentinelos_usb_storage_mode]
extends = env:sentinelos_lilygo_amoled
