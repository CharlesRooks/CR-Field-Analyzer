; CR Field Analyzer - SentinelOS
; Target: LILYGO T-Display S3 AMOLED Plus / ESP32-S3

[platformio]
default_envs = lilygo_t_display_s3_amoled_plus

[env:lilygo_t_display_s3_amoled_plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM